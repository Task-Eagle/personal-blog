<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <span class="brand-name" data-site-name>Field Notes</span>
        <span class="brand-tag" data-site-tagline>A small personal blog.</span>
      </a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 data-hero-title>Field Notes</h1>
      <p data-hero-tagline>A small personal blog.</p>
    </section>
    <section class="post-list" data-post-list></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">Written in small pieces. Hosted on Cloudflare Pages.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <script type="module" src="/js/home.js"></script>
</body>
</html>

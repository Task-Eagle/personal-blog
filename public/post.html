<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <span class="brand-name" data-site-name>Field Notes</span>
        <span class="brand-tag" data-site-tagline>A small personal blog.</span>
      </a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="wrap">
    <article class="post" data-article>
      <p class="hint">Loading…</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap"><a href="/">Back to all posts</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <script type="module" src="/js/post.js"></script>
</body>
</html>
